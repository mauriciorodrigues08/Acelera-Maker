<svg viewBox="0 0 900 1180" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="1180" fill="#ffffff"/>

  <text x="220" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Fluxo PF5 - Consultar</text>
  <text x="680" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Fluxo PF6 - Salvar</text>

  <line x1="450" y1="55" x2="450" y2="1140" stroke="#cccccc" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ===================== COLUNA PF5 ===================== -->

  <!-- Inicio -->
  <ellipse cx="220" cy="80" rx="90" ry="30" fill="#dbe9ff" stroke="#2b5797" stroke-width="1.5"/>
  <text x="220" y="85" text-anchor="middle" font-size="13" fill="#1a1a1a">Usuario tecla PF5</text>
  <line x1="220" y1="110" x2="220" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decisao codigo informado -->
  <polygon points="220,140 300,185 220,230 140,185" fill="#fff4d6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="220" y="180" text-anchor="middle" font-size="12" fill="#1a1a1a">Codigo do</text>
  <text x="220" y="195" text-anchor="middle" font-size="12" fill="#1a1a1a">cliente informado?</text>

  <!-- Nao -> mensagem obrigatorio -->
  <line x1="140" y1="185" x2="60" y2="185" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="100" y="175" text-anchor="middle" font-size="11" fill="#b00020">Nao</text>
  <rect x="0" y="165" width="120" height="40" rx="6" fill="#fde7e9" stroke="#b00020" stroke-width="1.5"/>
  <text x="60" y="182" text-anchor="middle" font-size="10.5" fill="#1a1a1a">Mensagem:</text>
  <text x="60" y="196" text-anchor="middle" font-size="9.5" fill="#1a1a1a">CODIGO OBRIGATORIO</text>
  <line x1="60" y1="205" x2="60" y2="1090" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Sim -> EXEC CICS READ -->
  <line x1="220" y1="230" x2="220" y2="265" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="222" font-size="11" fill="#1a6e1a">Sim</text>
  <rect x="130" y="265" width="180" height="46" rx="6" fill="#e8f0fe" stroke="#2b5797" stroke-width="1.5"/>
  <text x="220" y="284" text-anchor="middle" font-size="11" fill="#1a1a1a">EXEC CICS READ</text>
  <text x="220" y="298" text-anchor="middle" font-size="11" fill="#1a1a1a">FILE('CLIENTES')</text>

  <line x1="220" y1="311" x2="220" y2="345" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decisao encontrado -->
  <polygon points="220,345 310,395 220,445 130,395" fill="#fff4d6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="220" y="391" text-anchor="middle" font-size="12" fill="#1a1a1a">Cliente</text>
  <text x="220" y="406" text-anchor="middle" font-size="12" fill="#1a1a1a">encontrado?</text>

  <!-- Nao encontrado -->
  <line x1="130" y1="395" x2="60" y2="395" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="95" y="385" text-anchor="middle" font-size="11" fill="#b00020">Nao</text>
  <rect x="0" y="375" width="120" height="40" rx="6" fill="#fde7e9" stroke="#b00020" stroke-width="1.5"/>
  <text x="60" y="392" text-anchor="middle" font-size="10.5" fill="#1a1a1a">Mensagem:</text>
  <text x="60" y="406" text-anchor="middle" font-size="9" fill="#1a1a1a">CLIENTE NAO ENCONTRADO</text>

  <!-- Sim encontrado -->
  <line x1="220" y1="445" x2="220" y2="480" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="437" font-size="11" fill="#1a6e1a">Sim</text>
  <rect x="110" y="480" width="220" height="46" rx="6" fill="#e8f0fe" stroke="#2b5797" stroke-width="1.5"/>
  <text x="220" y="499" text-anchor="middle" font-size="11" fill="#1a1a1a">Exibe NOME, TELEFONE</text>
  <text x="220" y="513" text-anchor="middle" font-size="11" fill="#1a1a1a">e CIDADE na tela</text>

  <line x1="220" y1="526" x2="220" y2="560" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="80" y="560" width="280" height="40" rx="6" fill="#e3f6e3" stroke="#1a6e1a" stroke-width="1.5"/>
  <text x="220" y="578" text-anchor="middle" font-size="10.5" fill="#1a1a1a">Mensagem:</text>
  <text x="220" y="592" text-anchor="middle" font-size="9.5" fill="#1a1a1a">CLIENTE ENCONTRADO</text>

  <!-- Fim PF5 -->
  <line x1="60" y1="415" x2="60" y2="640" stroke="#333" stroke-width="1.5"/>
  <line x1="220" y1="600" x2="220" y2="640" stroke="#333" stroke-width="1.5"/>
  <line x1="60" y1="640" x2="220" y2="640" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <ellipse cx="220" cy="670" rx="80" ry="28" fill="#dbe9ff" stroke="#2b5797" stroke-width="1.5"/>
  <text x="220" y="675" text-anchor="middle" font-size="12" fill="#1a1a1a">Tela atualizada</text>

  <!-- ===================== COLUNA PF6 ===================== -->

  <!-- Inicio -->
  <ellipse cx="680" cy="80" rx="90" ry="30" fill="#dbe9ff" stroke="#2b5797" stroke-width="1.5"/>
  <text x="680" y="85" text-anchor="middle" font-size="13" fill="#1a1a1a">Usuario tecla PF6</text>
  <line x1="680" y1="110" x2="680" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decisao: cliente ja consultado -->
  <polygon points="680,140 780,195 680,250 580,195" fill="#fff4d6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="680" y="183" text-anchor="middle" font-size="12" fill="#1a1a1a">Cliente foi</text>
  <text x="680" y="198" text-anchor="middle" font-size="12" fill="#1a1a1a">consultado antes</text>
  <text x="680" y="213" text-anchor="middle" font-size="12" fill="#1a1a1a">(PF5)?</text>

  <!-- Nao -->
  <line x1="580" y1="195" x2="500" y2="195" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="540" y="185" text-anchor="middle" font-size="11" fill="#b00020">Nao</text>
  <rect x="440" y="175" width="120" height="40" rx="6" fill="#fde7e9" stroke="#b00020" stroke-width="1.5"/>
  <text x="500" y="192" text-anchor="middle" font-size="9.5" fill="#1a1a1a">Mensagem:</text>
  <text x="500" y="206" text-anchor="middle" font-size="9" fill="#1a1a1a">CONSULTE ANTES</text>
  <line x1="500" y1="215" x2="500" y2="1090" stroke="#cccccc" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Sim -->
  <line x1="680" y1="250" x2="680" y2="285" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="242" font-size="11" fill="#1a6e1a">Sim</text>
  <rect x="570" y="285" width="220" height="46" rx="6" fill="#e8f0fe" stroke="#2b5797" stroke-width="1.5"/>
  <text x="680" y="304" text-anchor="middle" font-size="11" fill="#1a1a1a">Le novo TELEFONE e</text>
  <text x="680" y="318" text-anchor="middle" font-size="11" fill="#1a1a1a">CIDADE digitados na tela</text>

  <line x1="680" y1="331" x2="680" y2="365" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="570" y="365" width="220" height="46" rx="6" fill="#e8f0fe" stroke="#2b5797" stroke-width="1.5"/>
  <text x="680" y="384" text-anchor="middle" font-size="11" fill="#1a1a1a">EXEC CICS READ UPDATE</text>
  <text x="680" y="398" text-anchor="middle" font-size="11" fill="#1a1a1a">FILE('CLIENTES')</text>

  <line x1="680" y1="411" x2="680" y2="445" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decisao encontrado -->
  <polygon points="680,445 770,495 680,545 590,495" fill="#fff4d6" stroke="#b8860b" stroke-width="1.5"/>
  <text x="680" y="491" text-anchor="middle" font-size="12" fill="#1a1a1a">Cliente</text>
  <text x="680" y="506" text-anchor="middle" font-size="12" fill="#1a1a1a">encontrado?</text>

  <!-- Nao -->
  <line x1="590" y1="495" x2="500" y2="495" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="545" y="485" text-anchor="middle" font-size="11" fill="#b00020">Nao</text>
  <rect x="440" y="475" width="120" height="40" rx="6" fill="#fde7e9" stroke="#b00020" stroke-width="1.5"/>
  <text x="500" y="492" text-anchor="middle" font-size="9.5" fill="#1a1a1a">Mensagem:</text>
  <text x="500" y="506" text-anchor="middle" font-size="8.5" fill="#1a1a1a">CLIENTE NAO ENCONTRADO</text>

  <!-- Sim -->
  <line x1="680" y1="545" x2="680" y2="580" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="537" font-size="11" fill="#1a6e1a">Sim</text>
  <rect x="570" y="580" width="220" height="46" rx="6" fill="#e8f0fe" stroke="#2b5797" stroke-width="1.5"/>
  <text x="680" y="599" text-anchor="middle" font-size="11" fill="#1a1a1a">Atualiza TELEFONE e</text>
  <text x="680" y="613" text-anchor="middle" font-size="11" fill="#1a1a1a">CIDADE no registro</text>

  <line x1="680" y1="626" x2="680" y2="660" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="570" y="660" width="220" height="40" rx="6" fill="#e8f0fe" stroke="#2b5797" stroke-width="1.5"/>
  <text x="680" y="677" text-anchor="middle" font-size="11" fill="#1a1a1a">EXEC CICS REWRITE</text>
  <text x="680" y="691" text-anchor="middle" font-size="11" fill="#1a1a1a">FILE('CLIENTES')</text>

  <line x1="680" y1="700" x2="680" y2="734" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="540" y="734" width="280" height="40" rx="6" fill="#e3f6e3" stroke="#1a6e1a" stroke-width="1.5"/>
  <text x="680" y="752" text-anchor="middle" font-size="10.5" fill="#1a1a1a">Mensagem:</text>
  <text x="680" y="766" text-anchor="middle" font-size="9.5" fill="#1a1a1a">ALTERACAO REALIZADA</text>

  <!-- Fim PF6 -->
  <line x1="500" y1="515" x2="500" y2="794" stroke="#333" stroke-width="1.5"/>
  <line x1="680" y1="774" x2="680" y2="794" stroke="#333" stroke-width="1.5"/>
  <line x1="500" y1="794" x2="680" y2="794" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <ellipse cx="680" cy="824" rx="80" ry="28" fill="#dbe9ff" stroke="#2b5797" stroke-width="1.5"/>
  <text x="680" y="829" text-anchor="middle" font-size="12" fill="#1a1a1a">Tela atualizada</text>

  <!-- Legenda -->
  <g transform="translate(40, 920)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#1a1a1a">Legenda</text>
    <rect x="0" y="14" width="22" height="16" rx="3" fill="#fff4d6" stroke="#b8860b" stroke-width="1.2"/>
    <text x="30" y="26" font-size="11" fill="#1a1a1a">Decisao</text>
    <rect x="120" y="14" width="22" height="16" rx="3" fill="#e8f0fe" stroke="#2b5797" stroke-width="1.2"/>
    <text x="150" y="26" font-size="11" fill="#1a1a1a">Processamento / comando CICS</text>
    <rect x="400" y="14" width="22" height="16" rx="3" fill="#fde7e9" stroke="#b00020" stroke-width="1.2"/>
    <text x="430" y="26" font-size="11" fill="#1a1a1a">Mensagem de erro</text>
    <rect x="600" y="14" width="22" height="16" rx="3" fill="#e3f6e3" stroke="#1a6e1a" stroke-width="1.2"/>
    <text x="630" y="26" font-size="11" fill="#1a1a1a">Mensagem de sucesso</text>
  </g>

  <text x="450" y="1160" text-anchor="middle" font-size="11" fill="#888888">Projeto 7 COBOL - Transacao CLIE / Programa CLIPGM</text>
</svg>
